<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCG — Circuits VTT & Gravel</title>
<style>
:root{
  --ink:#171717;
  --muted:#686868;
  --paper:#f5f5f5;
  --card:#ffffff;
  --green:#f28c28;
  --lime:#fff0df;
  --line:#e5e5e5;
  --blue:#d96f12;
  --red:#f28c28;
  --wood:#c96b12;
  --orange:#f28c28;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:14px max(24px,calc((100% - 1160px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px;background:#fff;border-bottom:3px solid var(--orange);box-shadow:0 3px 16px #0000000d;position:relative;z-index:3}
.brand{display:flex;align-items:center;gap:14px;font-weight:900;letter-spacing:-.04em;font-size:1.2rem}
.brand img{height:66px;width:auto;max-width:155px;object-fit:contain}
.brand span{color:var(--orange)}
.nav{color:var(--ink);font-size:.85rem;font-weight:800;letter-spacing:.04em;text-align:right}
.hero{background:linear-gradient(112deg,#111 0%,#242424 62%,#d96f12 100%);color:#fff;padding:68px 24px 78px;position:relative;overflow:hidden;border-bottom:8px solid var(--orange)}
.hero:after{content:"";position:absolute;width:390px;height:390px;border:1px solid #ffffff25;border-radius:50%;right:8%;top:-210px;box-shadow:0 0 0 42px #ffffff0c,0 0 0 84px #ffffff08}
.hero-inner{max-width:1160px;margin:auto;position:relative;z-index:1}
.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:.72rem;font-weight:900;color:#ffc184}
h1{font-size:clamp(2.5rem,6vw,4.7rem);line-height:.98;letter-spacing:-.06em;max-width:720px;margin:16px 0}
.hero p{color:#eeeeee;max-width:560px;margin:20px 0 0;font-size:1.05rem}
main{max-width:1160px;margin:32px auto 80px;padding:0 24px;position:relative;z-index:1}
.filters{background:#fff;border:1px solid var(--line);border-top:4px solid var(--orange);border-radius:18px;padding:22px;box-shadow:0 12px 32px #0000000c;display:grid;grid-template-columns:1.3fr 1.3fr 1.5fr auto;gap:18px;align-items:end}
label{display:block;font-size:.78rem;font-weight:750;color:#333;margin-bottom:8px}
.range{display:flex;align-items:center;gap:8px}
.range input{width:100%;min-width:0}
input[type=number],select{width:100%;border:1px solid #d8d8d8;border-radius:10px;padding:12px 11px;background:#fafafa;color:var(--ink);font:inherit;outline:none}
input:focus,select:focus{border-color:var(--orange);box-shadow:0 0 0 3px #f28c2826}
button{border:0;border-radius:11px;padding:13px 19px;background:var(--orange);color:#171717;font-weight:800;font:inherit;cursor:pointer;transition:.18s}
button:hover{transform:translateY(-1px);filter:brightness(.96)}
.reset{background:#222;color:#fff}
.results-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:38px 0 18px}
.results-head h2{font-size:1.55rem;letter-spacing:-.04em;margin:0}
.count{color:var(--muted);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.route{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.visual{height:180px;position:relative;background:#f2eadf;overflow:hidden}
.visual:before{content:"";position:absolute;inset:0;background:linear-gradient(155deg,transparent 35%,#ffffff55 35.3%,transparent 36%),linear-gradient(25deg,transparent 55%,#ffffff55 55.3%,transparent 56%);pointer-events:none}
.visual svg{width:100%;height:100%;position:absolute;inset:0}
.tag{position:absolute;top:13px;left:13px;border-radius:30px;padding:5px 10px;background:#fff;color:#171717;font-size:.7rem;font-weight:850;letter-spacing:.04em;border:1px solid #f2b36e}
.route-body{padding:18px;display:flex;flex-direction:column;flex:1}
.route h3{margin:0 0 6px;font-size:1.12rem;letter-spacing:-.025em}
.place{color:var(--muted);font-size:.85rem}
.metrics{display:flex;gap:18px;margin:18px 0 16px;padding:13px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.metric strong{display:block;font-size:1.1rem}
.metric small{color:var(--muted);font-size:.72rem}
.download{
  display:block;
  text-align:center;
  text-decoration:none;
  width:100%;
  margin-top:auto;
  padding:13px 19px;
  background:var(--orange);
  color:#171717;
  font-weight:800;
  border-radius:11px;
  transition:.18s;
}

.download:hover{
  transform:translateY(-1px);
  filter:brightness(.96);
}
.actions{
  display:flex;
  gap:8px;
  margin-top:auto;
}

.actions a,
.actions button{
  flex:1;
}

.view-image{
  background:#fff0df;
  border:1px solid #f28c28;
  color:#171717;
  font-weight:800;
  border-radius:11px;
  cursor:pointer;
}
.empty{grid-column:1/-1;text-align:center;padding:46px 20px;background:#fff;border:1px dashed #d4a16f;border-radius:16px;color:var(--muted)}
.note{margin-top:22px;color:var(--muted);font-size:.8rem}
footer{border-top:3px solid var(--orange);padding:24px;text-align:center;color:var(--muted);font-size:.82rem;background:#fff}
@media(max-width:850px){.filters{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){
  header{padding:18px 20px}
  .nav{display:none}
  .hero{padding:55px 22px 68px}
  main{padding:0 16px;margin-top:24px}
  .filters{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .results-head{align-items:start;flex-direction:column}
  .range{gap:6px}
}

/* Filtres enrichis et vraies images des circuits */
.filters{grid-template-columns:1.5fr 1fr 1fr 1fr 1fr 1.15fr auto}
input[type=number],input[type=search],select{width:100%;border:1px solid #d8d8d8;border-radius:10px;padding:12px 11px;background:#fafafa;color:var(--ink);font:inherit;outline:none;min-width:0}
.visual{height:220px;background:#eee}
.visual:before{display:none}
.visual img{width:100%;height:100%;display:block;object-fit:cover}
.filter-actions{display:flex;gap:8px}
.filter-actions button{white-space:nowrap}
@media(max-width:1100px){.filters{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:850px){.filters{grid-template-columns:1fr 1fr}.filter-actions{grid-column:1/-1}}
@media(max-width:560px){.filters{grid-template-columns:1fr}.filter-actions{grid-column:auto}.visual{height:210px}}

</style>
</head>

<main>
<section class="filters" aria-label="Filtres des circuits">
  <div><label for="searchName">Nom du circuit</label><input id="searchName" type="search" placeholder="Rechercher un circuit…"></div>
  <div><label for="minDistance">Distance minimum (km)</label><input id="minDistance" type="number" min="0" max="500" step="1" placeholder="Ex. 20"></div>
  <div><label for="maxDistance">Distance maximum (km)</label><input id="maxDistance" type="number" min="0" max="500" step="1" placeholder="Ex. 80"></div>
  <div><label for="minDplus">Dénivelé + minimum (m)</label><input id="minDplus" type="number" min="0" max="10000" step="10" placeholder="Ex. 300"></div>
  <div><label for="maxDplus">Dénivelé + maximum (m)</label><input id="maxDplus" type="number" min="0" max="10000" step="10" placeholder="Ex. 700"></div>
  <div><label for="type">Type de parcours</label><select id="type"><option value="all">Tous les parcours</option><option value="VTT">VTT</option><option value="Gravel">Gravel</option></select></div>
  <div class="filter-actions"><button id="apply" type="button">Filtrer</button><button class="reset" id="reset" type="button">Effacer</button></div>
</section>
<div class="results-head"><h2>Circuits à découvrir</h2><div class="count" id="count" aria-live="polite"></div></div>
<section class="grid" id="routes" aria-live="polite"></section>
</main>
<footer><strong style="color:#f28c28">ASCG</strong> · Association Sportive et Culturelle Gaël</footer>
<script>
const circuits=[
 {id:1,name:"Vers Loscouët-sur-meu, Mauron et Saint-Léry",type:"Gravel",km:34.91,dplus:247,image:"Vers Loscouët-sur-meu, Mauron et Saint-Léry.png",gpx:"Vers Loscouët-sur-meu, Mauron et Saint-Léry.gpx"},
 {id:2,name:"Aller retour Muel (petit circuit)",type:"Gravel",km:14.30,dplus:141,image:"Aller retour Muel (petit circuit).png",gpx:"Aller retour Muel (petit circuit).gpx"},
 {id:3,name:"Aller retour au terrain VTT de La Hautière à Muel",type:"VTT",km:14.30,dplus:141,image:"Aller retour au terrain VTT de La Hautière à Muel.png",gpx:"Aller retour au terrain VTT de La Hautière à Muel.gpx"},
 {id:4,name:"Aller retour Muel (grand circuit)",type:"Gravel",km:18.70,dplus:151,image:"Aller retour Muel (grand circuit).png",gpx:"Aller retour Muel (grand circuit).gpx"},
 {id:5,name:"Aller retour Saint-Léry",type:"Gravel",km:20.5,dplus:139,image:"Aller retour Saint-Léry.png",gpx:"Aller retour Saint-Léry.gpx"}
];
const $=id=>document.getElementById(id);
function render(){
 const query=$("searchName").value.trim().toLocaleLowerCase("fr");
 const minKm=$("minDistance").value===""?0:Number($("minDistance").value);
 const maxKm=$("maxDistance").value===""?Infinity:Number($("maxDistance").value);
 const minDplus=$("minDplus").value===""?0:Number($("minDplus").value);
 const maxDplus=$("maxDplus").value===""?Infinity:Number($("maxDplus").value);
 const type=$("type").value;
 const found=circuits.filter(c=>
  c.name.toLocaleLowerCase("fr").includes(query)&&
  c.km>=minKm&&c.km<=maxKm&&
  c.dplus>=minDplus&&c.dplus<=maxDplus&&
  (type==="all"||c.type===type)
 );
 $("count").textContent=`${found.length} circuit${found.length>1?"s":""} trouvé${found.length>1?"s":""}`;
 $("routes").innerHTML=found.length?found.map(c=>`
  <article class="route">
   <div class="visual"><img src="${encodeURI(c.image)}" alt="Carte réelle du circuit ${c.name}" loading="lazy"><span class="tag">${c.type}</span></div>
   <div class="route-body">
    <h3>${c.name}</h3>
    <div class="metrics">
     <div class="metric"><strong>${c.km.toLocaleString("fr-FR")} km</strong><small>Distance</small></div>
     <div class="metric"><strong>${c.dplus} m</strong><small>Dénivelé +</small></div>
    </div>
    <div class="actions">
  <button class="view-image"
          onclick="openImage('${encodeURI(c.image)}','${c.name}')">
    🔍 Afficher la carte
  </button>

  <a class="download"
     href="${encodeURI(c.gpx)}"
     download="${c.gpx}">
     Télécharger GPX
  </a>
</div>
   </div>
  </article>`).join(""):`<div class="empty"><strong>Aucun circuit trouvé</strong><br>Modifiez vos critères de recherche ou vos filtres.</div>`;
}
["searchName","minDistance","maxDistance","minDplus","maxDplus"].forEach(id=>{
 $(id).addEventListener("input",render);
 $(id).addEventListener("keydown",e=>{if(e.key==="Enter")render()});
});
$("type").addEventListener("change",render);
$("apply").addEventListener("click",render);
$("reset").addEventListener("click",()=>{
 ["searchName","minDistance","maxDistance","minDplus","maxDplus"].forEach(id=>$(id).value="");
 $("type").value="all";render();
});
render();
function openImage(src,title){
  const win = window.open("", "_blank");
  win.document.write(`
    <html>
    <head>
      <title>${title}</title>
      <style>
        body{
          margin:0;
          background:#111;
          display:flex;
          justify-content:center;
          align-items:center;
          min-height:100vh;
        }
        img{
          max-width:100%;
          max-height:100vh;
        }
      </style>
    </head>
    <body>
      <img src="${src}" alt="${title}">
    </body>
    </html>
  `);
}
</script>
</body></html>
